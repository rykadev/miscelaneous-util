
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steganography Reader</title>
<style>
    body {
        font: 16px sans-serif;
        max-width: 800px;
        margin: 40px auto;
        padding: 0 16px;
        background: #222;
        color: white;
    }

    #drop {
        border: 2px dashed #888;
        border-radius: 8px;
        padding: 50px 20px;
        text-align: center;
        cursor: pointer;
    }

    #drop.dragover {
        border-color: #4af;
        background: #333;
    }

    textarea {
        box-sizing: border-box;
        width: 100%;
        height: 250px;
        margin-top: 16px;
        padding: 12px;
        background: #111;
        color: #eee;
        border: 1px solid #555;
        resize: vertical;
    }

    #status {
        color: #aaa;
        margin-top: 12px;
    }

    img {
        display: none;
        max-width: 100%;
        max-height: 300px;
        margin-top: 16px;
    }
</style>
</head>
<body>

<h2>Steganography Reader</h2>

<div id="drop">Drop an image here, click to browse, or paste with Ctrl+V</div>
<input id="file" type="file" accept="image/*" hidden>

<img id="preview" alt="Selected image">
<textarea id="output" placeholder="Decoded hidden text will appear here..."></textarea>
<div id="status">Ready</div>

<script src="public/steganography.min.js"></script>
<script>
const drop = document.querySelector("#drop");
const fileInput = document.querySelector("#file");
const preview = document.querySelector("#preview");
const output = document.querySelector("#output");
const status = document.querySelector("#status");

async function readImage(blob) {
    status.textContent = "Reading image...";
    output.value = "";

    try {
        const url = URL.createObjectURL(blob);

        try {
            preview.src = url;
            await preview.decode();

            // Decode hidden text using steganography.js
            const text = steg.decode(preview);
            output.value = text || "";
            status.textContent = text
                ? "Hidden text decoded."
                : "No hidden text found.";
        } finally {
            URL.revokeObjectURL(url);
        }
    } catch (err) {
        console.error(err);
        status.textContent = "Decode failed: " + err.message;
    }
}

drop.addEventListener("click", () => fileInput.click());

fileInput.addEventListener("change", () => {
    const file = fileInput.files[0];
    if (file) readImage(file);
});

drop.addEventListener("dragover", e => {
    e.preventDefault();
    drop.classList.add("dragover");
});

drop.addEventListener("dragleave", () => {
    drop.classList.remove("dragover");
});

drop.addEventListener("drop", async e => {
    e.preventDefault();
    drop.classList.remove("dragover");

    const file = [...e.dataTransfer.files]
        .find(f => f.type.startsWith("image/"));

    if (file) {
        readImage(file);
        return;
    }

    const url = e.dataTransfer.getData("text/uri-list")
        .split("\n")
        .find(line => line && !line.startsWith("#"));

    if (url) {
        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error("HTTP " + response.status);
            readImage(await response.blob());
        } catch (err) {
            status.textContent =
                "Could not fetch image URL (possibly CORS): " + err.message;
        }
    }
});

document.addEventListener("paste", e => {
    const item = [...e.clipboardData.items]
        .find(item => item.type.startsWith("image/"));

    if (item) {
        const blob = item.getAsFile();
        if (blob) readImage(blob);
    }
});
</script>
</body>
</html>
